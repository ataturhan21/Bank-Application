name: Java tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test server domain and compile client
        run: |
          mvn --batch-mode --no-transfer-progress -f BankRestServer/pom.xml test
          mvn --batch-mode --no-transfer-progress -f BankRestClient/pom.xml package
